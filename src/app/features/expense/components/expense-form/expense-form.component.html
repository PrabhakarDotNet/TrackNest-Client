<div class="expense-form-card">
  <form (ngSubmit)="saveExpense()" class="expense-form">
    <div class="expense-form-row">
      <div class="field field--half">
        <label class="form-label">Amount</label>
        <input
          type="number"
          class="form-control"
          placeholder="0.00"
          [(ngModel)]="expense.amount"
          name="amount"
          required
        />
      </div>

      <div class="field field--half">
        <label class="form-label">Expense date</label>
        <input
          type="date"
          class="form-control"
          [(ngModel)]="expense.expenseDate"
          name="expenseDate"
        />
      </div>
    </div>

    <div class="field">
      <label class="form-label">Description</label>
      <input
        type="text"
        class="form-control"
        placeholder="e.g. food, travel, investment..."
        [(ngModel)]="expense.description"
        name="description"
        (input)="onDescriptionInput($event)"
      />
      <div class="hint" *ngIf="!aiSuggested && !aiLoading">Type a description and AI will suggest a category.</div>
      <div class="hint" *ngIf="aiLoading">AI is thinking...</div>
      <div class="hint hint--ai" *ngIf="aiSuggested && !aiLoading">Category auto-filled by AI. You can change it.</div>
    </div>

    <div class="field">
      <label class="form-label">
        Category
        <span class="ai-badge" *ngIf="aiSuggested">AI suggested</span>
      </label>
      <select
        class="form-select"
        [(ngModel)]="expense.category"
        name="category"
        required
      >
        <option value="" disabled>Select category</option>
        <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
      </select>
    </div>

    <div class="expense-form-actions">
      <button type="button" class="btn btn-cancel" (click)="cancelExpense()">Cancel</button>
      <button type="submit" class="btn btn-save">{{ expense.id && expense.id > 0 ? 'Update' : 'Save' }}</button>
    </div>
  </form>
</div>
