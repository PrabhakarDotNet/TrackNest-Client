<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h3>Create your account</h3>
      <p>Sign up to start tracking expenses with TrackNest.</p>
    </div>

    <form (ngSubmit)="signup()" class="auth-form">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" [(ngModel)]="name" name="name" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" [(ngModel)]="email" name="email" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" [(ngModel)]="password" name="password" required />
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" [(ngModel)]="confirmPassword" name="confirmPassword" required />
      </div>

      <div *ngIf="message" class="alert alert-warning py-2">{{ message }}</div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
        {{ loading ? 'Creating account...' : 'Sign Up' }}
      </button>
    </form>

    <div class="auth-footer">
      <span>Already have an account?</span>
      <a routerLink="/login">Login instead</a>
    </div>
  </div>
</div>
